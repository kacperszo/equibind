[project]
name = "equibind"
version = "0.1.0"
description = "EquiBind IEGMN embedding layer — PyTorch Geometric port (MIT)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3.0",
    "torch-geometric>=2.6.0",
    "numpy>=2.0.0",
    "rdkit>=2024.3.1",
    "biopython>=1.84",
    "biopandas>=0.5.1",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PyTorch CPU wheels (override per-platform for CUDA if needed)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
